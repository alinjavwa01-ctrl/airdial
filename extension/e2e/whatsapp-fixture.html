<!doctype html>
<html><head><meta charset="utf-8"><title>WhatsApp</title>
<style>body{font-family:sans-serif;display:flex;margin:0}#side{width:280px;border-right:1px solid #ddd}#main{flex:1;display:flex;flex-direction:column;height:100vh}
[role=listitem]{padding:8px;cursor:pointer}footer{display:flex;gap:8px;padding:8px;margin-top:auto}footer div[contenteditable]{flex:1;border:1px solid #ccc;min-height:24px;padding:4px}</style></head>
<body>
<div id="side">
  <div contenteditable="true" aria-label="Search input textbox"></div>
  <div id="pane-side"></div>
</div>
<div id="main"></div>
<script>
const chats = {
  'Kouvas': { unread: 2, msgs: [['in','09:12, 13/10/2026','Kouvas','Muli bwanji. How much for 50 kg T-bone?'], ['in','09:13, 13/10/2026','Kouvas','Can you send photos?']] },
  'Banda Catering': { unread: 0, msgs: [['out','Yesterday','Me','Delivered, thank you'], ['in','Yesterday','Banda Catering','Thanks']] },
};
function renderList() {
  const pane = document.getElementById('pane-side');
  pane.innerHTML = '';
  for (const [name, c] of Object.entries(chats)) {
    const row = document.createElement('div');
    row.setAttribute('role', 'listitem');
    const last = c.msgs[c.msgs.length - 1][3];
    row.innerHTML = `<div tabindex="-1"><span title="${name}">${name}</span> <span title="${last}">${last}</span>${c.unread ? `<span aria-label="${c.unread} unread messages">${c.unread}</span>` : ''}</div>`;
    row.addEventListener('click', () => openChat(name));
    pane.appendChild(row);
  }
}
function openChat(name) {
  chats[name].unread = 0;
  const main = document.getElementById('main');
  main.innerHTML = `<header><span title="${name}">${name}</span><button aria-label="Voice call">call</button></header><div id="msgs"></div>
    <footer><div contenteditable="true" role="textbox" aria-label="Type a message"></div><button aria-label="Send">➤</button></footer>`;
  renderMsgs(name);
  main.querySelector('footer button').addEventListener('click', () => {
    const box = main.querySelector('footer [contenteditable]');
    const text = box.innerText.trim();
    if (!text) return;
    chats[name].msgs.push(['out', '10:00, 13/10/2026', 'Me', text]);
    box.innerHTML = '';
    renderMsgs(name);
    window.__sent = (window.__sent || []).concat([{ name, text }]);
  });
  renderList();
}
function renderMsgs(name) {
  const box = document.getElementById('msgs');
  box.innerHTML = chats[name].msgs.map(([dir, t, a, text]) =>
    `<div role="row"><div class="message-${dir}"><div data-pre-plain-text="[${t}] ${a}: "><span class="selectable-text">${text}</span></div></div></div>`).join('');
}
renderList();
</script>
</body></html>
